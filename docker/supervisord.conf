[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid

# 가상 디스플레이. 네이버 headless 탐지를 피하려고 실제 크롬을 여기 띄운다.
[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb.err

# 최초 로그인과 세션 복구용. 네이버 세션은 영구적이지 않아 상시 필요하다.
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbauth /data/.vncpasswd -rfbport 5900 -quiet
autorestart=true
priority=20
stdout_logfile=/data/logs/x11vnc.log
stderr_logfile=/data/logs/x11vnc.err

[program:novnc]
command=websockify --web=/usr/share/novnc --cert=/certs/server.crt --key=/certs/server.key 6080 localhost:5900
autorestart=true
priority=30
stdout_logfile=/data/logs/novnc.log
stderr_logfile=/data/logs/novnc.err

[program:mcp]
command=naver-blog-mcp
autorestart=true
priority=40
stdout_logfile=/data/logs/mcp.log
stderr_logfile=/data/logs/mcp.err
