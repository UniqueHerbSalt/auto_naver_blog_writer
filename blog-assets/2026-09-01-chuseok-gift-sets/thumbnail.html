<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 폰트는 시스템에 설치된 Noto Serif KR(가변)과 Pretendard를 사용한다 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background:
      radial-gradient(circle at 50% 12%, rgba(255, 240, 200, 0.55) 0%, rgba(255, 240, 200, 0) 46%),
      linear-gradient(175deg, #f9f3e8 0%, #f5ecdb 60%, #f0e4cd 100%);
    position: relative;
  }

  /* 보름달 — 크고 은은하게, 타이틀 뒤 */
  .moon {
    position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    width: 330px; height: 330px; border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #fffdf4, #fff3c9 58%, #fbe49b);
    box-shadow: 0 0 110px 44px rgba(255, 231, 160, 0.5);
    opacity: 0.9;
  }

  .content {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    padding: 168px 90px 120px;
  }

  .eyebrow {
    font-family: 'Noto Serif KR', serif;
    font-weight: 600; font-size: 27px; color: #a4762e;
    letter-spacing: 14px; text-indent: 14px;
  }

  h1 {
    font-family: 'Noto Serif KR Black', 'Noto Serif KR', serif;
    color: #2f2416;
    font-size: 108px;
    line-height: 1.3;
    margin-top: 40px;
    letter-spacing: -3px;
  }
  h1 .line2 { position: relative; display: inline-block; }
  /* 브러시 하이라이트 */
  h1 .line2::before {
    content: '';
    position: absolute; left: -10px; right: -10px; bottom: 14px; height: 40%;
    background: linear-gradient(90deg, rgba(240, 170, 70, 0.5), rgba(226, 122, 48, 0.55));
    border-radius: 6px;
    transform: skewX(-4deg);
    z-index: -1;
  }

  .divider {
    margin-top: 58px;
    display: flex; align-items: center; gap: 22px;
    color: rgba(164, 118, 46, 0.65);
  }
  .divider .line { width: 64px; height: 1px; background: rgba(164, 118, 46, 0.45); }
  .divider .diamond {
    width: 8px; height: 8px; background: rgba(164, 118, 46, 0.65);
    transform: rotate(45deg);
  }

  .sub {
    margin-top: 52px;
    font-weight: 600; font-size: 40px; color: #7a6248;
    letter-spacing: -0.5px;
  }
  .sub b { font-weight: 800; color: #b3552e; }

  .tagline {
    margin-top: 22px;
    font-family: 'Noto Serif KR Black', 'Noto Serif KR', serif;
    font-size: 62px; color: #2f2416;
    letter-spacing: 1px;
  }

  /* 하단 미니멀 장식: 가는 선 + 달항아리 실루엣 대신 심플한 점 3개 */
  .footer {
    margin-top: auto;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .dots { display: flex; gap: 14px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(164, 118, 46, 0.5); }
  .dots span:nth-child(2) { background: rgba(179, 85, 46, 0.65); }

  /* 좌우 하단의 아주 은은한 산 능선 */
  .hills { position: absolute; bottom: 0; left: 0; width: 100%; }
</style>
</head>
<body>
  <div class="moon"></div>

  <svg class="hills" viewBox="0 0 1000 180" preserveAspectRatio="none">
    <path d="M0 180 L0 120 C160 70 300 100 470 88 C660 74 820 96 1000 60 L1000 180 Z" fill="#ead9ba" opacity="0.55"/>
    <path d="M0 180 L0 150 C220 110 420 138 600 126 C780 114 900 130 1000 108 L1000 180 Z" fill="#e3cfa8" opacity="0.6"/>
  </svg>

  <div class="content">
    <div class="eyebrow">추석 선물 가이드</div>

    <h1>추석 선물세트<br><span class="line2">고민이라면?</span></h1>

    <div class="divider">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line"></div>
    </div>

    <div class="sub"><b>3만원대</b>부터 <b>10만원대</b>까지</div>
    <div class="tagline">인기 추석선물</div>

    <div class="footer">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</body>
</html>
