<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(160deg, #faf1e0 0%, #f6e7cd 55%, #f0dcba 100%);
    position: relative;
  }

  /* 은은한 전통 창살 패턴 */
  .lattice {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(140, 90, 40, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 90, 40, 0.05) 1px, transparent 1px);
    background-size: 62px 62px;
  }

  /* 보름달 */
  .moon {
    position: absolute; top: -130px; right: -110px;
    width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fff8e2, #ffe9a8 60%, #f7d87c);
    box-shadow: 0 0 90px 30px rgba(255, 226, 150, 0.55);
  }

  .frame {
    position: absolute; inset: 26px;
    border: 3px solid rgba(146, 84, 30, 0.35);
    border-radius: 26px;
  }
  .frame::after {
    content: ''; position: absolute; inset: 8px;
    border: 1.5px solid rgba(146, 84, 30, 0.22);
    border-radius: 18px;
  }

  .content {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 66px 78px 58px;
  }

  .badge {
    background: #b0402c; color: #fff6e8;
    font-weight: 700; font-size: 30px; letter-spacing: 6px;
    padding: 10px 34px 12px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(176, 64, 44, 0.35);
  }

  h1 {
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    text-align: center;
    color: #3c2a17;
    font-size: 88px;
    line-height: 1.14;
    margin-top: 26px;
    letter-spacing: -1px;
  }
  h1 .accent { color: #b0402c; }

  .cards { width: 100%; margin-top: 44px; display: flex; flex-direction: column; gap: 22px; }

  .card {
    display: flex; align-items: center; gap: 26px;
    background: rgba(255, 253, 246, 0.92);
    border: 2px solid rgba(146, 84, 30, 0.18);
    border-radius: 22px;
    padding: 20px 34px;
    box-shadow: 0 6px 18px rgba(120, 72, 20, 0.10);
  }

  .price {
    flex: 0 0 208px; text-align: center;
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 46px; color: #fffdf5;
    padding: 14px 0 16px; border-radius: 16px;
    letter-spacing: 0;
  }
  .p3  { background: linear-gradient(135deg, #5c7a3f, #3f5c2a); }
  .p5  { background: linear-gradient(135deg, #e07b2e, #c05a17); }
  .p10 { background: linear-gradient(135deg, #a3312a, #7c1f1a); }

  .icon { flex: 0 0 92px; height: 92px; }

  .label { display: flex; flex-direction: column; }
  .label .name {
    font-weight: 900; font-size: 52px; color: #33230f; letter-spacing: -1px; line-height: 1.1;
  }
  .label .desc {
    font-weight: 500; font-size: 27px; color: #8a6b45; margin-top: 6px;
  }

  .footer {
    margin-top: auto;
    display: flex; align-items: center; gap: 18px;
    color: #6b4a22; font-weight: 700; font-size: 29px; letter-spacing: 0;
    white-space: nowrap;
  }
  .footer .line { width: 70px; height: 2px; background: rgba(107, 74, 34, 0.45); }
</style>
</head>
<body>
  <div class="lattice"></div>
  <div class="moon"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="badge">2026 추석</div>
    <h1>추석 선물세트<br><span class="accent">고민이라면?</span></h1>

    <div class="cards">
      <div class="card">
        <div class="price p3">3만원대</div>
        <svg class="icon" viewBox="0 0 100 100">
          <!-- 한과: 유과 스택 -->
          <rect x="14" y="58" width="72" height="20" rx="9" fill="#e8b04c"/>
          <rect x="20" y="40" width="60" height="19" rx="9" fill="#f2c96e"/>
          <rect x="27" y="23" width="46" height="18" rx="9" fill="#f7dc95"/>
          <g fill="#fff" opacity="0.85">
            <circle cx="34" cy="32" r="1.9"/><circle cx="46" cy="29" r="1.9"/><circle cx="58" cy="33" r="1.9"/>
            <circle cx="33" cy="49" r="1.9"/><circle cx="50" cy="47" r="1.9"/><circle cx="66" cy="50" r="1.9"/>
            <circle cx="28" cy="67" r="1.9"/><circle cx="47" cy="70" r="1.9"/><circle cx="65" cy="66" r="1.9"/><circle cx="77" cy="69" r="1.9"/>
          </g>
        </svg>
        <div class="label">
          <div class="name">한과 세트</div>
          <div class="desc">정갈한 마음, 부담 없는 가격</div>
        </div>
      </div>

      <div class="card">
        <div class="price p5">5만원대</div>
        <svg class="icon" viewBox="0 0 100 100">
          <!-- 곶감 -->
          <path d="M50 20 C72 20 84 38 82 58 C80 78 66 88 50 88 C34 88 20 78 18 58 C16 38 28 20 50 20 Z" fill="#e0752f"/>
          <path d="M50 24 C58 24 66 30 68 40 C60 34 40 34 32 40 C34 30 42 24 50 24 Z" fill="#c85f1d"/>
          <path d="M50 6 L54 20 L46 20 Z" fill="#6d4a22"/>
          <g fill="#4f7a35">
            <path d="M50 16 L64 12 L56 22 Z"/>
            <path d="M50 16 L36 12 L44 22 Z"/>
          </g>
          <path d="M34 52 C40 62 60 62 66 52" stroke="#b5511a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="42" cy="44" rx="6" ry="9" fill="#f0975a" opacity="0.6"/>
        </svg>
        <div class="label">
          <div class="name">곶감 세트</div>
          <div class="desc">어르신 취향 저격 안전픽</div>
        </div>
      </div>

      <div class="card">
        <div class="price p10">10만원대</div>
        <svg class="icon" viewBox="0 0 100 100">
          <!-- 한우: 마블링 스테이크 -->
          <path d="M18 38 C18 24 36 18 52 20 C72 22 86 32 84 48 C82 66 68 80 48 80 C28 80 14 66 18 38 Z" fill="#c0392b"/>
          <path d="M24 40 C24 30 38 25 51 27 C67 29 78 36 77 48 C75 62 64 73 48 73 C32 73 21 62 24 40 Z" fill="#d95a4a"/>
          <g stroke="#ffe9e0" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.9">
            <path d="M32 40 C40 36 48 42 56 38"/>
            <path d="M30 52 C40 48 50 56 62 50"/>
            <path d="M36 63 C44 58 54 64 62 60"/>
            <path d="M58 33 C64 36 68 42 70 47"/>
          </g>
        </svg>
        <div class="label">
          <div class="name">한우 선물세트</div>
          <div class="desc">귀한 분께 제대로 한 수</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="line"></div>
      3만원대부터 10만원대까지 · 인기 추석선물
      <div class="line"></div>
    </div>
  </div>
</body>
</html>
