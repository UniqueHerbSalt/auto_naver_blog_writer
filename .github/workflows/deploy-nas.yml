# NAS 의 self-hosted runner 에서 이미지를 빌드하고 갈아 끼운다.
#
# 러너가 NAS 위에서 돌므로 레지스트리를 거치지 않고 로컬에서 바로 빌드한다.
# 이미지를 밖으로 내보내지 않으니 자격증명 관리가 하나 줄어든다.
name: Deploy to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: [self-hosted, nas]
    steps:
      - uses: actions/checkout@v4

      - name: 배포 전 설정 확인
        # .env 와 인증서는 NAS 에 직접 두는 것이고 저장소에 없다.
        # 없는 채로 재기동하면 컨테이너가 죽으므로 먼저 막는다.
        run: |
          test -f .env       || { echo ".env 가 없습니다. NAS 작업 디렉터리에 두세요." >&2; exit 1; }
          test -f certs/server.crt || { echo "certs/server.crt 가 없습니다. gen-certs.sh 를 먼저 실행하세요." >&2; exit 1; }

      - name: 빌드
        run: docker compose build

      - name: 교체
        # 로그인 세션은 ./data 볼륨에 있어 컨테이너를 갈아 끼워도 살아남는다.
        run: docker compose up -d

      - name: 기동 확인
        run: |
          sleep 15
          docker compose ps
          docker compose logs --tail=30 naver-blog-mcp
