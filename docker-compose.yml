services:
  naver-blog-mcp:
    build: .
    image: naver-blog-mcp:latest
    container_name: naver-blog-mcp
    restart: unless-stopped

    ports:
      - "8443:8443"   # MCP (HTTPS)
      - "6080:6080"   # noVNC — 최초 로그인·세션 복구용

    volumes:
      # 로그인 세션이 사는 곳. 이 볼륨이 이 시스템의 유일한 상태다.
      - ./data:/data
      - ./certs:/certs:ro

    environment:
      NAVER_BLOG_BLOG_ID: "${NAVER_BLOG_BLOG_ID:?블로그 아이디를 .env 에 설정하세요}"
      NAVER_BLOG_TOKEN: "${NAVER_BLOG_TOKEN:?토큰을 .env 에 설정하세요}"
      VNC_PASSWORD: "${VNC_PASSWORD:?VNC 비밀번호를 .env 에 설정하세요}"

      NAVER_BLOG_TRANSPORT: "http"
      NAVER_BLOG_PORT: "8443"
      NAVER_BLOG_TLS_CERT: "/certs/server.crt"
      NAVER_BLOG_TLS_KEY: "/certs/server.key"

      # 안전 기본값 — 공개 발행은 도구 호출에서 명시적으로 요청할 때만.
      NAVER_BLOG_OPEN_TYPE: "${NAVER_BLOG_OPEN_TYPE:-private}"
      NAVER_BLOG_CATEGORY: "${NAVER_BLOG_CATEGORY:-}"

      # 컨테이너 안 크롬에 필요한 인자. headless 는 켜지 않는다 —
      # Xvfb 위에서 실제 크롬으로 돌려야 네이버 탐지에 덜 걸린다.
      NAVER_BLOG_EXTRA_CHROME_ARGS: "--no-sandbox --disable-dev-shm-usage --window-size=1920,1080"
      NAVER_BLOG_HEADLESS: "false"

    # 크롬은 /dev/shm 을 많이 쓴다. 기본 64MB 로는 탭이 죽는다.
    shm_size: "2gb"
